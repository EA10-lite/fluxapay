name: Integration Tests

on:
  push:
    branches: ["main"]
    paths:
      - "fluxapay_backend/**"
      - "fluxapay_frontend/**"
      - "docker-compose.ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "fluxapay_backend/**"
      - "fluxapay_frontend/**"
      - "docker-compose.ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-integration:
    name: Backend Integration & Smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fluxapay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: fluxapay_backend/package-lock.json

      - name: Install dependencies
        working-directory: ./fluxapay_backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./fluxapay_backend
        run: npx prisma generate

      - name: Sync database schema
        working-directory: ./fluxapay_backend
        run: npx prisma db push
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fluxapay_test?schema=public

      - name: Run unit tests
        working-directory: ./fluxapay_backend
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fluxapay_test?schema=public
          JWT_SECRET: ci-test-jwt-secret-key
          KMS_PROVIDER: local
          KMS_ENCRYPTION_PASSPHRASE: ci-test-passphrase-for-hd-wallet-secure
          HD_WALLET_MASTER_SEED: ci-test-master-seed-32chars-long-padded!!
          DISABLE_CRON: "true"
          WEBHOOK_SECRET: ci-test-webhook-secret
          CLOUDINARY_CLOUD_NAME: test
          CLOUDINARY_API_KEY: test
          CLOUDINARY_API_SECRET: test
          RESEND_API_KEY: re_test
          SMS_PROVIDER: mock
          STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
          STELLAR_NETWORK_PASSPHRASE: Test SDF Network ; September 2015
          FUNDER_SECRET_KEY: SBXEHJKWF7C7BIFSUGXZE7XKFJ5SP6Y7JGPD4J4TKMX2MQXWQQRF3BSG
          MASTER_VAULT_SECRET_KEY: SDGHCAPDRWTOTBAQT6HJ5KBUZOECD2JEOH6E76NDL4OXNBXIWODLZA4B
          USDC_ISSUER_PUBLIC_KEY: GBVXGET7UCLTTLDZGVWDDMZ7FVLCNZL75GU7BLVPTWUP6UIVYHAY5OAX

      - name: Build backend
        working-directory: ./fluxapay_backend
        run: npm run build

      - name: Start backend and run smoke tests
        working-directory: ./fluxapay_backend
        run: |
          npm start &
          npx --yes wait-on@9.0.4 http://localhost:3000/health --timeout 120000 --interval 2000
          npm run test:smoke
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fluxapay_test?schema=public
          JWT_SECRET: ci-test-jwt-secret-key
          KMS_PROVIDER: local
          KMS_ENCRYPTION_PASSPHRASE: ci-test-passphrase-for-hd-wallet-secure
          HD_WALLET_MASTER_SEED: ci-test-master-seed-32chars-long-padded!!
          DISABLE_CRON: "true"
          WEBHOOK_SECRET: ci-test-webhook-secret
          CLOUDINARY_CLOUD_NAME: test
          CLOUDINARY_API_KEY: test
          CLOUDINARY_API_SECRET: test
          RESEND_API_KEY: re_test
          SMS_PROVIDER: mock
          STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
          STELLAR_NETWORK_PASSPHRASE: Test SDF Network ; September 2015
          FUNDER_SECRET_KEY: SBXEHJKWF7C7BIFSUGXZE7XKFJ5SP6Y7JGPD4J4TKMX2MQXWQQRF3BSG
          MASTER_VAULT_SECRET_KEY: SDGHCAPDRWTOTBAQT6HJ5KBUZOECD2JEOH6E76NDL4OXNBXIWODLZA4B
          USDC_ISSUER_PUBLIC_KEY: GBVXGET7UCLTTLDZGVWDDMZ7FVLCNZL75GU7BLVPTWUP6UIVYHAY5OAX
          API_BASE_URL: http://localhost:3000

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: fluxapay_backend/coverage/
          retention-days: 7
          if-no-files-found: ignore

  frontend-integration:
    name: Frontend Integration
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: fluxapay_frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./fluxapay_frontend
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        working-directory: ./fluxapay_frontend
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: ./fluxapay_frontend
        run: npm run build

      - name: Run unit tests
        working-directory: ./fluxapay_frontend
        run: npm test

      - name: Start frontend and run E2E smoke tests
        working-directory: ./fluxapay_frontend
        run: |
          npm start &
          npx --yes wait-on@9.0.4 http://localhost:3075 --timeout 120000 --interval 2000
          npm run test:e2e:smoke
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3075
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: fluxapay_frontend/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
